[package]
description = "hotswap — the `upgrade` verb inside each gigantic tool: mise moves the version; hotswap drains, swaps, smokes, then settles or rolls back"
edition = "2024"
# SPDX id, not `license-file`: crates.io and dependency scanners read `license`.
license = "PolyForm-Noncommercial-1.0.0"
name = "hotswap"
readme = "README.md"
repository = "https://github.com/jgeschwendt/hotswap"
version = "0.1.0"

# No binary: each tool links this and calls `hotswap::upgrade` from its own `upgrade` verb.
[lib]
doctest = false
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# Its own `main`: run under a tool's name (argv[0]) it is that tool's `upgrade`, run bare the suite.
[[test]]
harness = false
name = "hotswap"

# Maximalist opt-out (the house lint discipline, verbatim): turn on the whole
# strict, *stable* set (clippy::pedantic), then opt out the few we disagree
# with, each with a reason. `cargo clippy -- -D warnings` promotes all of this
# to errors.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Inline `#[allow]`s must carry a reason — the `noInlineConfig` discipline.
allow_attributes_without_reason = "warn"
# --- opt-outs (with rationale) ---
# Field names are wire names: the record's `probe`.
struct_field_names = "allow"
# ≈ eslint `max-lines-per-function: off`; one straight-line `upgrade` beats helpers called once.
too_many_lines = "allow"
